name: Container Build
description: Build a container image, scan it for vulnerabilities with Trivy and push it to a registry.
author: OneK8s
branding:
  icon: package
  color: blue

inputs:
  image:
    description: "Image name, e.g. ghcr.io/owner/app, or a name below the registry (e.g. team/app). Default: <registry>/<owner>/<repository>."
    required: false
  registry:
    description: "Registry (and optional namespace) used for automatic image names. Default: CONTAINER_REGISTRY environment variable, else ghcr.io."
    required: false
  tags:
    description: "Comma or newline separated tags. Default: short SHA plus 'latest' (main/master), branch name, 'pr-<n>' or git tag."
    required: false
  context:
    description: "Build context directory."
    required: false
    default: "."
  dockerfile:
    description: "Path to the Dockerfile. Default: <context>/Dockerfile."
    required: false
  build-args:
    description: "Newline separated build arguments (KEY=VALUE)."
    required: false
  target:
    description: "Target build stage."
    required: false
  push:
    description: "'auto' (push except for pull requests), 'true' or 'false'."
    required: false
    default: "auto"
  username:
    description: "Registry username. Not needed for ghcr.io (uses github-token), with CONTAINER_REGISTRY_USERNAME/PASSWORD environment variables, or when already logged in."
    required: false
  password:
    description: "Registry password or token."
    required: false
  github-token:
    description: "Token used for ghcr.io when no password is given. Requires 'packages: write' permission."
    required: false
    default: ${{ github.token }}
  safe-chain:
    description: "Protect package installs (npm, yarn, pnpm, pip, uv, poetry, ...) in the Dockerfile's RUN instructions with Aikido Safe Chain (blocks malware and packages newer than 48h)."
    required: false
    default: "true"
  sbom:
    description: "Generate an SBOM of the image."
    required: false
    default: "true"
  sbom-format:
    description: "SBOM format: cyclonedx or spdx-json."
    required: false
    default: "cyclonedx"
  scan:
    description: "Scan the image with Trivy before pushing."
    required: false
    default: "true"
  severity:
    description: "Comma separated severities to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)."
    required: false
    default: "CRITICAL,HIGH"
  fail-on-vulnerabilities:
    description: "Fail (and do not push) when vulnerabilities are found."
    required: false
    default: "true"
  ignore-unfixed:
    description: "Ignore vulnerabilities that have no fix available."
    required: false
    default: "true"
  trivy-version:
    description: "Trivy version (or full scanner image reference)."
    required: false

outputs:
  image:
    description: "Image repository, e.g. ghcr.io/owner/app"
  tags:
    description: "Comma separated list of full image references that were built"
  digest:
    description: "Digest of the pushed image (sha256:...)"
  image-ref:
    description: "Immutable image reference (image@digest)"
  vulnerabilities:
    description: "Number of vulnerabilities found by the scan"
  sbom:
    description: "Path to the SBOM file (upload it with actions/upload-artifact)"
  scan-report:
    description: "Path to the Trivy JSON report"

runs:
  using: node24
  main: dist/index.js
