name: Release

# Release by pushing a vX.Y.Z tag, or with "Run workflow" on main, which tags the
# version from package.json for you.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run check

      - name: Determine and create tag
        id: tag
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run the release from main"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists. Bump the version in package.json first."; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          else
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Package Azure DevOps extension
        run: npx tfx extension create --root azure --manifest-globs vss-extension.json --output-path dist-azure

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" dist-azure/*.vsix --generate-notes --verify-tag

      - name: Move major version tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

      - name: Publish to Visual Studio Marketplace
        env:
          MARKETPLACE_TOKEN: ${{ secrets.AZURE_DEVOPS_MARKETPLACE_TOKEN }}
        if: env.MARKETPLACE_TOKEN != ''
        run: npx tfx extension publish --vsix dist-azure/*.vsix --auth-type pat --token "$MARKETPLACE_TOKEN"
