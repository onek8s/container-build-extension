name: Release

# Release by pushing a vX.Y.Z tag, or with "Run workflow" on main, which tags the
# version from package.json for you.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # GitHub OIDC subject for the Marketplace publisher's service principal
    environment: marketplace
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run check

      - name: Determine and create tag
        id: tag
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run the release from main"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists. Bump the version in package.json first."; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          else
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Package Azure DevOps extension
        run: node scripts/package-azure.mjs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" dist-azure/*.vsix --generate-notes --verify-tag

      - name: Move major version tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

      # Publishing uses GitHub OIDC -> Microsoft Entra service principal (member of the Marketplace
      # publisher); enabled when the variable AZURE_DEVOPS_CLIENT_ID is set. See docs/azure-devops-e2e.md.
      - name: Sign in to Microsoft Entra ID (GitHub OIDC)
        if: vars.AZURE_DEVOPS_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEVOPS_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        if: vars.AZURE_DEVOPS_CLIENT_ID != ''
        run: |
          token=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
          echo "::add-mask::${token}"
          npx tfx extension publish --vsix dist-azure/*.vsix --auth-type pat -t "$token" --no-prompt \
            ${{ vars.ADO_ORGANIZATION != '' && format('--share-with {0}', vars.ADO_ORGANIZATION) || '' }}
