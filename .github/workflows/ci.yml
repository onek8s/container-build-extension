name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run check
      - name: Check bundled files are up to date
        run: |
          if [ -n "$(git status --porcelain dist azure)" ]; then
            git status --porcelain dist azure
            git diff dist azure | head -50
            echo "::error::dist/ or azure/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
      - name: Package Azure DevOps extension
        run: npx tfx extension create --root azure --manifest-globs vss-extension.json --output-path dist-azure
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist-azure/*.vsix

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bicep (Managed DevOps Pool)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bicep"
          # warnings (unknown properties etc.) fail the build
          out=$("$RUNNER_TEMP/bicep" build examples/azure-devops-managed-pool/main.bicep --stdout 2>&1 >/dev/null)
          echo "$out"
          [ -z "$out" ]
      - name: Helm (Actions Runner Controller)
        run: |
          bash -n examples/github-arc-aks/setup.sh
          helm template container-build oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
            -n arc-runners -f examples/github-arc-aks/values.yaml > "$RUNNER_TEMP/arc.yaml"
          grep -q 'azure.workload.identity/use: "true"' "$RUNNER_TEMP/arc.yaml"
          grep -q 'serviceAccountName: container-build-runner' "$RUNNER_TEMP/arc.yaml"

  e2e-github:
    needs: check
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v5

      - name: Build, scan and push
        id: build
        uses: ./
        with:
          image: localhost:5000/e2e/app
          context: test/fixtures/app
          push: "true"

      - name: Verify outputs and registry
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.build.outputs.image-ref }}
          TAGS: ${{ steps.build.outputs.tags }}
          VULNS: ${{ steps.build.outputs.vulnerabilities }}
          SBOM: ${{ steps.build.outputs.sbom }}
        run: |
          set -eu
          echo "digest=$DIGEST image-ref=$IMAGE_REF tags=$TAGS vulnerabilities=$VULNS sbom=$SBOM"
          # SBOM lists the npm dependency installed (through safe-chain) during the build
          jq -e '.bomFormat == "CycloneDX" and ([.components[] | select(.name == "is-number")] | length == 1)' "$SBOM"
          [[ "$DIGEST" == sha256:* ]]
          [[ "$IMAGE_REF" == "localhost:5000/e2e/app@$DIGEST" ]]
          [[ "$VULNS" == "0" ]]
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          curl -sf localhost:5000/v2/e2e/app/tags/list | tee /dev/stderr | grep -q "\"$short\""
          docker pull "$IMAGE_REF"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ steps.build.outputs.sbom }}

      - name: Malicious package must be blocked by safe-chain
        id: malicious
        continue-on-error: true
        uses: ./
        with:
          image: localhost:5000/e2e/malicious
          context: test/fixtures/malicious
          push: "true"

      - name: Verify malicious build was blocked
        env:
          OUTCOME: ${{ steps.malicious.outcome }}
        run: |
          set -eu
          echo "outcome=$OUTCOME"
          [[ "$OUTCOME" == "failure" ]]
          ! curl -sf localhost:5000/v2/e2e/malicious/tags/list

      - name: Vulnerable image must not be pushed
        id: vulnerable
        continue-on-error: true
        uses: ./
        with:
          image: localhost:5000/e2e/vulnerable
          context: test/fixtures/vulnerable
          push: "true"
          # keep the check strict when this CI job itself is re-run
          bypass-on-rerun: "false"

      - name: Verify vulnerable image was blocked
        env:
          OUTCOME: ${{ steps.vulnerable.outcome }}
          VULNS: ${{ steps.vulnerable.outputs.vulnerabilities }}
        run: |
          set -eu
          echo "outcome=$OUTCOME vulnerabilities=$VULNS"
          [[ "$OUTCOME" == "failure" ]]
          [[ "$VULNS" -gt 0 ]]
          ! curl -sf localhost:5000/v2/e2e/vulnerable/tags/list

  e2e-azure:
    # Runs the bundled Azure DevOps task with the environment the Azure Pipelines agent provides,
    # including a username/password service connection against an authenticated registry.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Start authenticated registry
        run: |
          mkdir -p "$RUNNER_TEMP/auth"
          docker run --rm --entrypoint htpasswd httpd:2 -Bbn tester s3cret > "$RUNNER_TEMP/auth/htpasswd"
          docker run -d -p 5001:5000 -v "$RUNNER_TEMP/auth:/auth" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=e2e -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2
          sleep 3
      - name: Run Azure task
        env:
          INPUT_IMAGE: localhost:5001/e2e/azure-app
          INPUT_CONTEXT: test/fixtures/app
          INPUT_CONTAINERREGISTRY: 11111111-2222-3333-4444-555555555555
          ENDPOINT_AUTH_SCHEME_11111111-2222-3333-4444-555555555555: UsernamePassword
          ENDPOINT_AUTH_PARAMETER_11111111-2222-3333-4444-555555555555_USERNAME: tester
          ENDPOINT_AUTH_PARAMETER_11111111-2222-3333-4444-555555555555_PASSWORD: s3cret
          ENDPOINT_AUTH_PARAMETER_11111111-2222-3333-4444-555555555555_REGISTRY: localhost:5001
          BUILD_SOURCEVERSION: ${{ github.sha }}
          BUILD_SOURCEBRANCH: refs/tags/v9.8.7
          BUILD_REASON: Manual
          BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
        run: |
          set -o pipefail
          node azure/tasks/ContainerBuild/index.js | tee "$RUNNER_TEMP/azure.log"
      - name: Verify
        run: |
          set -eu
          grep -q '##vso\[task.setvariable variable=digest;isOutput=true\]sha256:' "$RUNNER_TEMP/azure.log"
          sbom=$(sed -n 's/^##vso\[artifact.upload containerfolder=sbom;artifactname=sbom\]//p' "$RUNNER_TEMP/azure.log")
          jq -e '.bomFormat == "CycloneDX"' "$sbom"
          tags=$(curl -sf -u tester:s3cret localhost:5001/v2/e2e/azure-app/tags/list)
          echo "$tags"
          echo "$tags" | grep -q '"v9.8.7"'
          echo "$tags" | grep -q '"9.8.7"'

      - name: Run Azure task with variable group credentials and automatic image name
        env:
          CONTAINER_REGISTRY: localhost:5001
          CONTAINER_REGISTRY_USERNAME: tester
          # the agent passes secret variables to tasks as SECRET_<NAME>
          SECRET_CONTAINER_REGISTRY_PASSWORD: s3cret
          INPUT_CONTEXT: test/fixtures/app
          INPUT_SCAN: "false"
          SYSTEM_TEAMPROJECT: E2E Project
          BUILD_REPOSITORY_NAME: Demo_Repo
          BUILD_SOURCEVERSION: ${{ github.sha }}
          BUILD_SOURCEBRANCH: refs/heads/main
          BUILD_REASON: IndividualCI
          BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node azure/tasks/ContainerBuild/index.js | tee "$RUNNER_TEMP/azure-vars.log"
          tags=$(curl -sf -u tester:s3cret localhost:5001/v2/e2e-project/demo_repo/tags/list)
          echo "$tags"
          echo "$tags" | grep -q '"latest"'
          if grep -v 'task.setsecret' "$RUNNER_TEMP/azure-vars.log" | grep -q s3cret; then echo "::error::password leaked to the log"; exit 1; fi

      - name: Re-run of a failed job accepts vulnerabilities
        env:
          INPUT_IMAGE: localhost:5001/e2e/rerun
          INPUT_CONTEXT: test/fixtures/vulnerable
          INPUT_SBOM: "false"
          CONTAINER_REGISTRY: localhost:5001
          CONTAINER_REGISTRY_USERNAME: tester
          SECRET_CONTAINER_REGISTRY_PASSWORD: s3cret
          SYSTEM_JOBATTEMPT: "2"
          BUILD_SOURCEVERSION: ${{ github.sha }}
          BUILD_SOURCEBRANCH: refs/heads/main
          BUILD_REASON: IndividualCI
          BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node azure/tasks/ContainerBuild/index.js | tee "$RUNNER_TEMP/azure-rerun.log"
          grep -q 'accepted because this is a re-run' "$RUNNER_TEMP/azure-rerun.log"
          curl -sf -u tester:s3cret localhost:5001/v2/e2e/rerun/tags/list | grep -q latest

  e2e-reusable-workflow:
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/container-build.yml
    with:
      context: test/fixtures/app
      push: "false"
      action-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  e2e-reusable-workflow-verify:
    needs: e2e-reusable-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Verify automatic image name
        env:
          IMAGE: ${{ needs.e2e-reusable-workflow.outputs.image }}
          TAGS: ${{ needs.e2e-reusable-workflow.outputs.tags }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          echo "image=$IMAGE tags=$TAGS"
          [[ "$IMAGE" == */"${REPO,,}" ]]
          [[ "$TAGS" == *"$IMAGE:"* ]]

  # Optional: real push to Azure Container Registry with GitHub OIDC. Enable by setting the repository
  # variables E2E_ACR (e.g. myacr.azurecr.io), AZURE_CLIENT_ID and AZURE_TENANT_ID, with a federated
  # credential for this repository and the AcrPush role on the registry.
  e2e-acr-oidc:
    needs: check
    if: vars.E2E_ACR != '' && github.event_name != 'pull_request' || vars.E2E_ACR != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        id: build
        with:
          registry: ${{ vars.E2E_ACR }}
          context: test/fixtures/app
          push: "true"
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - run: '[[ "${{ steps.build.outputs.digest }}" == sha256:* ]]'
